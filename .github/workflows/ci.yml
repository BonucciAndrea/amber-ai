name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------- transport
  # The HTTP client, linked against src/net.c ALONE. It starts its own loopback
  # server on an ephemeral port, so it needs no Amber, no model backend and no
  # fixed port -- the fastest signal in the workflow, run on every compiler we
  # claim to support, on both operating systems.
  transport:
    name: net / ${{ matrix.os }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: gcc
            cc: gcc
          - os: ubuntu-latest
            label: clang
            cc: clang
          - os: macos-latest
            label: clang
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A GitHub runner's apt can stall for a whole job rather than fail: a
          # package that opens a debconf prompt waits for a tty that is not
          # there, and an apt mirror reached over IPv6 that blackholes gives no
          # error at all, just a hang. Every knob below turns one of those silent
          # waits into a bounded, reported error:
          #   DEBIAN_FRONTEND  no interactive prompt can ever be raised
          #   -o Acquire::Retries       retry a dropped mirror instead of stalling
          #   -o Acquire::http::Timeout cap each request (seconds)
          #   ForceIPv4        skip the IPv6 mirror path that blackholes on Azure
          #   --no-install-recommends   fewer packages, fewer prompts, less time
          #   timeout NNN      a hard ceiling, so a hang FAILS instead of hanging
          sudo rm -rf /var/lib/apt/lists/*
          sudo timeout 300 apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true
          sudo timeout 600 apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::ForceIPv4=true build-essential clang
      - name: Build + run tests/test_net.c
        env:
          CC: ${{ matrix.cc }}
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh --quick

  # ------------------------------------------------------- install + full run
  # The real thing: check Amber out beside us, build it, run ./install.sh into a
  # throwaway copy, run every suite against a MOCK backend, then ./uninstall.sh
  # and assert the engine is stock again.
  #
  # A GitHub runner has no GPU and no Ollama daemon, so tests/mock_backend.py
  # stands in for one. It speaks the real HTTP that src/net.c parses, over a real
  # loopback socket, so the transport, the deadline handling and the JSON
  # extraction are all genuinely exercised -- only the model is fake.
  integration:
    name: ${{ matrix.os }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      # Python must not buffer: the mock backend runs in the background with its
      # output redirected, so a buffered traceback dies with the process and the
      # step can only report the symptom.
      PYTHONUNBUFFERED: "1"
      # A generous ANSWER budget for the test run only. The compiled default is
      # 10s (src/net.c); a macos-latest runner under CPU contention was missing
      # even the old 2s one, and test_e2e.py's ai_answer, ai_why_sees_the_error
      # and response_shapes failed with "the model backend did not answer in
      # time" against a mock that had in fact replied. This is a deadline, not a
      # sleep -- the mock answers in milliseconds, so raising the ceiling costs
      # nothing on a fast runner and removes the false positive on a slow one.
      AMBER_AI_TIMEOUT_MS: "30000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: gcc
            cc: gcc
          - os: ubuntu-latest
            label: clang
            cc: clang
          - os: macos-latest
            label: clang
            cc: clang
          - os: macos-latest
            label: gcc
            cc: brew-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          path: amber-ai

      - name: Check out Amber
        uses: actions/checkout@v4
        with:
          repository: bonucciandrea/amber
          path: amber

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A GitHub runner's apt can stall for a whole job rather than fail: a
          # package that opens a debconf prompt waits for a tty that is not
          # there, and an apt mirror reached over IPv6 that blackholes gives no
          # error at all, just a hang. Every knob below turns one of those silent
          # waits into a bounded, reported error:
          #   DEBIAN_FRONTEND  no interactive prompt can ever be raised
          #   -o Acquire::Retries       retry a dropped mirror instead of stalling
          #   -o Acquire::http::Timeout cap each request (seconds)
          #   ForceIPv4        skip the IPv6 mirror path that blackholes on Azure
          #   --no-install-recommends   fewer packages, fewer prompts, less time
          #   timeout NNN      a hard ceiling, so a hang FAILS instead of hanging
          sudo rm -rf /var/lib/apt/lists/*
          sudo timeout 300 apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true
          sudo timeout 600 apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::ForceIPv4=true build-essential clang rlwrap

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update --quiet || true
          brew install rlwrap || true
          if [ "${{ matrix.cc }}" = "brew-gcc" ]; then brew install gcc || true; fi

      - name: Resolve compiler
        run: |
          set -e
          if [ "${{ matrix.cc }}" = "brew-gcc" ]; then
            CC_BIN=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* 2>/dev/null | sort -V | tail -1)
            [ -n "$CC_BIN" ] || { echo "no Homebrew gcc found"; exit 1; }
          else
            CC_BIN=$(command -v ${{ matrix.cc }})
          fi
          echo "CC=$CC_BIN" >> "$GITHUB_ENV"
          "$CC_BIN" --version | head -1

      - name: Build Amber
        run: |
          cd amber
          chmod +x a build.sh
          AMBER_NATIVE=1 ./build.sh
          ./amber --version
          grep AMBER_EXT_ABI src/ext.h

      # A clone of this repository arrives with the scripts' executable bit
      # dependent on how the checkout was made, so set it explicitly rather than
      # trusting it -- the "shell hygiene" job below is what keeps the index honest.
      - name: Make scripts executable
        run: |
          cd amber-ai
          chmod +x install.sh uninstall.sh setup-ollama.sh tests/run_tests.sh
          chmod +x tests/*.py

      - name: Launch Mock LLM Backend
        # A GitHub runner has no Ollama daemon, so this stands in for one on the
        # default port. Wait for the listener rather than `sleep 2`: a blind
        # sleep is both slower than needed and still racy on a loaded runner.
        run: |
          cd amber-ai
          chmod +x tests/mock_backend.py
          # nohup + a log file, not a bare `&`.
          #   * a bare `&` leaves the server in the STEP's process group. When the
          #     step's shell exits, the macOS runner tears that group down, so the
          #     listener that answered here is gone by the next step. nohup (plus
          #     detaching stdio) is what survives the handover.
          #   * python3 buffers stdout/stderr when they are not a tty, so a
          #     traceback -- "Address already in use", a bad --shape, an import
          #     error -- died in the buffer with the process and the step could
          #     only report the SYMPTOM: "mock backend never came up". -u makes
          #     the reason reach the log, and the log is printed on failure below.
          nohup python3 -u tests/mock_backend.py 11434 > /tmp/mock.log 2>&1 &
          echo $! > /tmp/mock.pid
          disown || true

          # Readiness probe: ~60s, up from ~10s. A cold macOS runner can take
          # tens of seconds just to import http.server the first time, and the
          # old budget was tight enough that a slow runner failed a healthy
          # server. --retry-connrefused is the point of the curl: without it curl
          # treats ECONNREFUSED as fatal and never retries at all.
          up=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 --retry 10 --retry-delay 1 --retry-connrefused \
                    http://127.0.0.1:11434/api/tags > /tmp/mock.probe 2>/dev/null; then
              up=1; echo "mock backend up after ${i}s"; break
            fi
            # A dead server will never come up: stop waiting the full minute for it.
            if ! kill -0 "$(cat /tmp/mock.pid)" 2>/dev/null; then
              echo "::error::mock_backend.py exited during startup"; break
            fi
            sleep 0.5
          done
          if [ "$up" != 1 ]; then
            echo "::error::mock backend never came up on 127.0.0.1:11434"
            echo "---- mock_backend.py output ----"; cat /tmp/mock.log || true
            echo "---- listeners on 11434 ----"
            (lsof -nP -iTCP:11434 -sTCP:LISTEN || netstat -an | grep 11434 || true)
            exit 1
          fi
          cat /tmp/mock.probe

      - name: Run AI Integration Tests
        run: |
          cd amber-ai
          chmod +x install.sh uninstall.sh setup-ollama.sh tests/run_tests.sh tests/*.py
          # The engine under test is the checkout built two steps ago. Its ./a is
          # a tracked SHELL SCRIPT, and run_tests.sh tars this tree into a
          # throwaway copy mode-for-mode -- so a launcher that is 644 here is 644
          # in the copy, install.sh's probe reads back nothing, and the run fails
          # as "the \`aio verb did not register -- the extension did not link",
          # blaming ext/ for a file mode. Assert the bits on the SOURCE tree.
          chmod +x "$GITHUB_WORKSPACE/amber/a" "$GITHUB_WORKSPACE/amber/build.sh"
          chmod +x "$GITHUB_WORKSPACE/amber/amber" 2>/dev/null || true
          ls -l "$GITHUB_WORKSPACE/amber/a"
          ./tests/run_tests.sh "$GITHUB_WORKSPACE/amber"

      - name: Mock backend log
        if: always()
        run: cat /tmp/mock.log || true

      - name: Stop mock backend
        if: always()
        run: kill "$(cat /tmp/mock.pid)" 2>/dev/null || true

  # ------------------------------------------------------------- script hygiene
  scripts:
    name: shell hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A GitHub runner's apt can stall for a whole job rather than fail: a
          # package that opens a debconf prompt waits for a tty that is not
          # there, and an apt mirror reached over IPv6 that blackholes gives no
          # error at all, just a hang. Every knob below turns one of those silent
          # waits into a bounded, reported error:
          #   DEBIAN_FRONTEND  no interactive prompt can ever be raised
          #   -o Acquire::Retries       retry a dropped mirror instead of stalling
          #   -o Acquire::http::Timeout cap each request (seconds)
          #   ForceIPv4        skip the IPv6 mirror path that blackholes on Azure
          #   --no-install-recommends   fewer packages, fewer prompts, less time
          #   timeout NNN      a hard ceiling, so a hang FAILS instead of hanging
          sudo rm -rf /var/lib/apt/lists/*
          sudo timeout 300 apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true
          sudo timeout 600 apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::ForceIPv4=true shellcheck

      - name: Executable bits are committed
        # ./install.sh is the FIRST command in the README. A clone whose scripts
        # are mode 644 answers it with "Permission denied", which reads as a
        # broken project rather than a missing chmod.
        run: |
          set -e
          fail=0
          for f in install.sh uninstall.sh setup-ollama.sh tests/run_tests.sh; do
            [ -f "$f" ] || continue
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode is $mode, expected 100755 -- run: git update-index --chmod=+x $f"
              fail=1
            fi
          done
          exit $fail

      - name: No GNU-only constructs in portable scripts
        run: |
          set -e
          # Match only a real USE. The previous pattern was '(^|[^#])readlink -f',
          # whose [^#] was meant to skip comments -- but every one of these
          # scripts documents the hazard as:
          #     # `readlink -f` is GNU coreutils. BSD/macOS ...
          # where the character before "readlink" is a BACKTICK, not the '#'.
          # So [^#] matched, the job flagged its own documentation, and this step
          # failed on every run in a tree with no `readlink -f` in it at all.
          # Anchoring at the line start instead means any '#' ahead of the match
          # excludes the line, while `x=$(readlink -f "$0")` still trips it.
          if grep -rn --include='*.sh' -E '^[^#]*readlink[[:space:]]+-f' . ; then
            echo "::error::readlink -f is not portable; use the am_scriptdir helper"
            exit 1
          fi
          echo "clean"

      - name: shellcheck
        run: shellcheck -S warning install.sh uninstall.sh setup-ollama.sh tests/run_tests.sh || true
